<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Climb Racing 2D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
        }

        .ui-panel {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .fuel-bar-container {
            width: 150px;
            height: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 4px;
        }

        .fuel-bar {
            width: 100%;
            height: 100%;
            background: #2ed573;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 14px;
            color: #a4b0be;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="ui-panel">
            <div>
                <div>Quãng đường: <span id="distance">0</span> m</div>
                <div>Xu: <span id="coins">0</span> 🪙</div>
            </div>
            <div>
                <div>Nhiên liệu</div>
                <div class="fuel-bar-container">
                    <div id="fuelBar" class="fuel-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls-hint">
        Dùng phím <b>Mũi tên Phải / D</b> để Tăng tốc | <b>Mũi tên Trái / A</b> để Phanh/Lùi | Phím <b>Space</b> để chơi lại
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const distanceEl = document.getElementById('distance');
    const coinsEl = document.getElementById('coins');
    const fuelBarEl = document.getElementById('fuelBar');

    // Biến game
    let gameOver = false;
    let scoreDistance = 0;
    let coinsCount = 0;
    let fuel = 100;
    let cameraX = 0;

    // Phím điều khiển
    const keys = { right: false, left: false };

    // Sinh địa hình Perlin-like đơn giản
    function getTerrainHeight(x) {
        return Math.sin(x * 0.005) * 60 + Math.sin(x * 0.015) * 30 + Math.sin(x * 0.001) * 120 + 320;
    }

    function getTerrainAngle(x) {
        const dx = 1;
        const dy = getTerrainHeight(x + dx) - getTerrainHeight(x - dx);
        return Math.atan2(dy, dx * 2);
    }

    // Vật phẩm (Xăng & Coin)
    let items = [];
    function generateItems() {
        items = [];
        for (let x = 500; x < 20000; x += 300 + Math.random() * 400) {
            const isFuel = Math.random() < 0.25;
            items.push({
                x: x,
                y: getTerrainHeight(x) - 30,
                type: isFuel ? 'fuel' : 'coin',
                collected: false
            });
        }
    }

    // Đối tượng Xe
    const car = {
        x: 100,
        y: 200,
        vx: 0,
        vy: 0,
        angle: 0,
        angularVelocity: 0,
        width: 60,
        height: 25,
        wheelRadius: 12,

        reset() {
            this.x = 100;
            this.y = getTerrainHeight(100) - 40;
            this.vx = 0;
            this.vy = 0;
            this.angle = 0;
            this.angularVelocity = 0;
        }
    };

    // Sự kiện bàn phím
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
        if (e.key === ' ' && gameOver) resetGame();
    });

    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    });

    // Cập nhật vật lý
    function updatePhysics() {
        if (gameOver) return;

        // Trọng lực
        car.vy += 0.25;

        // Tiêu hao xăng khi ga
        if (keys.right && fuel > 0) {
            car.vx += Math.cos(car.angle) * 0.18;
            car.vy += Math.sin(car.angle) * 0.18;
            fuel -= 0.08;
        }
        if (keys.left && fuel > 0) {
            car.vx -= Math.cos(car.angle) * 0.12;
            car.vy -= Math.sin(car.angle) * 0.12;
            fuel -= 0.04;
        }

        // Xăng tự giảm chậm
        fuel -= 0.015;
        if (fuel <= 0) {
            fuel = 0;
            if (Math.abs(car.vx) < 0.1) gameOver = true;
        }

        // Cập nhật vị trí
        car.x += car.vx;
        car.y += car.vy;
        car.angle += car.angularVelocity;

        // Ma sát không khí
        car.vx *= 0.99;
        car.vy *= 0.99;
        car.angularVelocity *= 0.95;

        // Va chạm địa hình
        const groundY = getTerrainHeight(car.x);
        const groundAngle = getTerrainAngle(car.x);

        if (car.y + car.height / 2 >= groundY) {
            car.y = groundY - car.height / 2;
            car.vy = 0;

            // Lực bám mặt đất
            const targetAngle = groundAngle;
            car.angle += (targetAngle - car.angle) * 0.2;

            // Giảm xóc & Ma sát
            car.vx *= 0.98;

            // Kiểm tra lật xe (Game Over nếu đầu xe đập đất)
            const angleDiff = Math.abs((car.angle - groundAngle) % (Math.PI * 2));
            if (angleDiff > Math.PI / 1.8 && angleDiff < (Math.PI * 1.5)) {
                gameOver = true;
            }
        } else {
            // Xoay xe trên không khi nhấn phím
            if (keys.right) car.angularVelocity += 0.005;
            if (keys.left) car.angularVelocity -= 0.005;
        }

        // Cập nhật Camera & Điểm
        cameraX = car.x - 200;
        scoreDistance = Math.max(scoreDistance, Math.floor(car.x / 10));

        // Kiểm tra ăn vật phẩm
        items.forEach(item => {
            if (!item.collected && Math.hypot(car.x - item.x, car.y - item.y) < 40) {
                item.collected = true;
                if (item.type === 'coin') {
                    coinsCount += 10;
                } else if (item.type === 'fuel') {
                    fuel = Math.min(100, fuel + 40);
                }
            }
        });

        // Cập nhật UI
        distanceEl.innerText = scoreDistance;
        coinsEl.innerText = coinsCount;
        fuelBarEl.style.width = fuel + '%';
        fuelBarEl.style.backgroundColor = fuel < 25 ? '#ff4757' : '#2ed573';
    }

    // Vẽ địa hình
    function drawTerrain() {
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);

        for (let screenX = 0; screenX <= canvas.width + 10; screenX += 5) {
            const worldX = screenX + cameraX;
            const worldY = getTerrainHeight(worldX);
            ctx.lineTo(screenX, worldY);
        }

        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();

        // Màu lòng đất
        ctx.fillStyle = '#6D4C41';
        ctx.fill();

        // Lớp cỏ trên mặt đất
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#2ed573';
        ctx.stroke();
    }

    // Vẽ Xe
    function drawCar() {
        ctx.save();
        ctx.translate(car.x - cameraX, car.y);
        ctx.rotate(car.angle);

        // Thân xe
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.roundRect(-car.width / 2, -car.height / 2, car.width, car.height, 6);
        ctx.fill();

        // Mui xe
        ctx.fillStyle = '#2f3542';
        ctx.fillRect(-10, -car.height / 2 - 10, 25, 12);

        // Bánh xe trước & sau
        ctx.fillStyle = '#57606f';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;

        // Bánh sau
        ctx.beginPath();
        ctx.arc(-car.width / 3, car.height / 3, car.wheelRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Bánh trước
        ctx.beginPath();
        ctx.arc(car.width / 3, car.height / 3, car.wheelRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }

    // Vẽ Vật phẩm
    function drawItems() {
        items.forEach(item => {
            if (item.collected) return;
            const screenX = item.x - cameraX;
            if (screenX < -50 || screenX > canvas.width + 50) return;

            if (item.type === 'coin') {
                ctx.beginPath();
                ctx.arc(screenX, item.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#ffa502';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (item.type === 'fuel') {
                ctx.fillStyle = '#ff4757';
                ctx.fillRect(screenX - 10, item.y - 12, 20, 24);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 10px Arial';
                ctx.fillText('GAS', screenX - 9, item.y + 4);
            }
        });
    }

    // Vẽ Màn hình Thua
    function drawGameOver() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff4757';
        ctx.font = 'bold 36px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

        ctx.fillStyle = '#ffffff';
        ctx.font = '18px Arial';
        ctx.fillText(`Quãng đường: ${scoreDistance} m | Tiền xu: ${coinsCount}`, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText('Nhấn Space để chơi lại', canvas.width / 2, canvas.height / 2 + 50);
    }

    // Reset Game
    function resetGame() {
        scoreDistance = 0;
        coinsCount = 0;
        fuel = 100;
        gameOver = false;
        car.reset();
        generateItems();
        loop();
    }

    // Vòng lặp chính
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        updatePhysics();
        drawTerrain();
        drawItems();
        drawCar();

        if (!gameOver) {
            requestAnimationFrame(loop);
        } else {
            drawGameOver();
        }
    }

    // Khởi chạy
    generateItems();
    car.reset();
    loop();
</script>

</body>
</html>
